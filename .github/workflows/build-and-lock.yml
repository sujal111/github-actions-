# .github/workflows/build-and-lock.yml
name: Build & Generate uv.lock

on:
  push:
    branches:
      - develop

permissions:
  contents: write   # allow the workflow to push commits (must be enabled in repo Settings)

jobs:
  build-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with write permissions)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true  # allow pushes using GITHUB_TOKEN

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install uv (Astral) and set up Python
        uses: astral-sh/setup-uv@v6
        with:
          # optional: pin a uv version, or omit to use latest compatible
          version: "0.9.5"
          # optionally set python version to use (or use project's pyproject)
          # python-version: "3.11"
          enable-cache: true

      - name: Install Python (optional) via uv (ensures project python present)
        run: |
          # Use uv to install Python pinned by pyproject or default.
          uv python install || true
        shell: bash

      - name: Generate / update uv.lock
        working-directory: backend
        run: |
          # run uv lock (updates uv.lock)
          uv lock
          # show git status for debugging
          git --no-pager status --porcelain
        shell: bash

      - name: Commit and push uv.lock if changed
        working-directory: backend
        run: |
          # configure git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # if uv.lock exists at repo root or backend/, adjust path
          # here we assume uv.lock is created in backend/uv.lock
          if git status --porcelain | grep -q "uv.lock"; then
            git add uv.lock
            git commit -m "ci: update uv.lock (generated by CI)"
            # push back to develop branch
            git push origin HEAD:develop
          else
            echo "No changes to uv.lock"
          fi
        shell: bash
